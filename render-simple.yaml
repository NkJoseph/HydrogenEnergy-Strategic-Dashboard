services:
  # Backend API Service
  - type: web
    name: hydrogen-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
    healthCheckPath: /health
    plan: starter

  # Frontend Dashboard Service  
  - type: web
    name: hydrogen-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start_dashboard_render.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8050
      - key: HYDROGEN_API_URL
        value: https://hydrogen-api.onrender.com
    healthCheckPath: /
    plan: starter
