# Kubernetes deployment for Alibaba Cloud Container Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydrogen-dashboard
  labels:
    app: hydrogen-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hydrogen-dashboard
  template:
    metadata:
      labels:
        app: hydrogen-dashboard
    spec:
      containers:
      - name: hydrogen-dashboard
        image: your-registry/hydrogen-dashboard:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hydrogen-dashboard-service
  labels:
    app: hydrogen-dashboard
spec:
  selector:
    app: hydrogen-dashboard
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hydrogen-dashboard-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hydrogen-dashboard-service
            port:
              number: 80
