services:
  # Single service with both API and Dashboard
  - type: web
    name: hydrogen-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python dashboard.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8050
    healthCheckPath: /
    plan: starter
